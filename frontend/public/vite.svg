<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
    <!-- Rear wing top plate -->
    <rect x="21" y="4.5" width="11" height="2.5" rx="0.5" fill="#e10600"/>
    <!-- Rear wing endplates / supports -->
    <rect x="23.5" y="7" width="1.5" height="9" fill="#e10600"/>
    <rect x="29" y="7" width="1.5" height="6.5" fill="#e10600"/>

    <!-- Front wing -->
    <rect x="-0.5" y="18" width="6" height="2.5" rx="0.5" fill="#e10600"/>

    <!-- Body: low wedge from nose to tail -->
    <path d="M 3 19.5
           Q 7 15, 14 13.5
           L 21 13
           L 24 15.5
           L 30 16.5
           L 30 19
           L 25 19.5
           L 4 19.5
           Z"
          fill="#e10600"/>

    <!-- Cockpit opening -->
    <ellipse cx="16" cy="12.8" rx="3" ry="1.3" fill="#15151e"/>

    <!-- Front wheel -->
    <circle cx="7" cy="21.5" r="4" fill="#15151e"/>
    <circle cx="7" cy="21.5" r="1.5" fill="#d0d0d0"/>

    <!-- Rear wheel -->
    <circle cx="24" cy="21.5" r="4.4" fill="#15151e"/>
    <circle cx="24" cy="21.5" r="1.7" fill="#d0d0d0"/>
</svg>