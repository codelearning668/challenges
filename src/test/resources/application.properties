spring.main.banner-mode=OFF

logging.level.root=ERROR

#logging.level.org.springframework.boot.SpringApplication=INFO
#logging.level.org.springframework.boot.context.config=INFO
logging.level.sk.mkrajcovic.challenges=OFF

# hibernate je jak virus
spring.jpa.show-sql=false

#h2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=false
spring.datasource.driver-class-name: org.h2.Driver
spring.datasource.url=jdbc:h2:mem:challenges_testdb;DB_CLOSE_DELAY=-1;
spring.datasource.username=sa
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.jpa.defer-datasource-initialization=true

challenges.exception.display-stack-trace:true
challenges.request-logging.enabled=true
challenges.request-logging.exclude-paths=/users/register

springdoc.api-docs.enabled=false

# Placeholder values allow the selected Gmail integration beans to be created during tests.
# Tests must not make Gmail API calls.
challenges.mail.provider=gmail
challenges.gmail.client-id=test-client-id
challenges.gmail.client-secret=test-client-secret
challenges.gmail.refresh-token=test-refresh-token
challenges.gmail.from=test@example.com