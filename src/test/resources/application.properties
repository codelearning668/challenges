spring.main.banner-mode=OFF

logging.level.root=ERROR

#logging.level.org.springframework.boot.SpringApplication=INFO
#logging.level.org.springframework.boot.context.config=INFO
logging.level.sk.mkrajcovic.challenges=OFF

# hibernate je jak virus
spring.jpa.show-sql=false

#h2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=false
spring.datasource.driver-class-name: org.h2.Driver
spring.datasource.url=jdbc:h2:mem:challenges_testdb;DB_CLOSE_DELAY=-1;
spring.datasource.username=sa
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

challenges.exception.display-stack-trace:true
challenges.request-logging.enabled=true
