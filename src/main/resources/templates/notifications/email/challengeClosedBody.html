<!DOCTYPE html>
<html>
<body
	style="margin: 0; padding: 0; background-color: #f4f6f8; font-family: Arial, Helvetica, sans-serif; color: #101828;">
	<div
		style="max-width: 620px; margin: 24px auto; background-color: #ffffff; border: 1px solid #e4e7ec; border-radius: 12px; overflow: hidden;">

		<div
			style="padding: 28px 32px; background-color: #182230; color: #ffffff;">
			<div style="font-size: 30px; line-height: 1.2;">🏁</div>
			<h1 style="margin: 10px 0 0; font-size: 25px; line-height: 1.25;">
				Challenge finished</h1>
			<p style="margin: 8px 0 0; color: #d0d5dd; font-size: 15px;">%s</p>
		</div>

		<div style="padding: 28px 32px;">
			<p style="margin: 0 0 24px; font-size: 16px; line-height: 1.55;">
				The final result is in.</p>

			<table role="presentation" width="100%%" cellspacing="0"
				cellpadding="0"
				style="border-collapse: collapse; margin-bottom: 24px;">
				<tr>
					<td
						style="padding: 14px 16px; background-color: #f9fafb; border-bottom: 1px solid #eaecf0;">
						<div
							style="font-size: 12px; font-weight: bold; letter-spacing: 0.08em; color: #667085;">CAR</div>
						<div style="padding-top: 4px; font-size: 17px; font-weight: bold;">
							%s %s</div>
					</td>
				</tr>
				<tr>
					<td
						style="padding: 14px 16px; background-color: #f9fafb; border-bottom: 1px solid #eaecf0;">
						<div
							style="font-size: 12px; font-weight: bold; letter-spacing: 0.08em; color: #667085;">TRACK</div>
						<div style="padding-top: 4px; font-size: 17px; font-weight: bold;">
							%s</div> <br>
					<span style="" "color:#667085;\">%s</span>
					</td>
				</tr>
				<tr>
					<td
						style="padding: 14px 16px; background-color: #fff7ed; border: 1px solid #fed7aa;">
						<div
							style="font-size: 12px; font-weight: bold; letter-spacing: 0.08em; color: #9a3412;">WINNER</div>
						<div style="padding-top: 4px; font-size: 20px; font-weight: bold;">
							%s</div>
						<div style="padding-top: 4px; color: #9a3412; font-size: 15px;">
							Best lap: %s</div>
					</td>
				</tr>
			</table>

			<a
				href="https://kokot.server.gratex.com/challenges/svc/challenges/%s"
				style="display: inline-block; padding: 13px 20px; background-color: #175cd3; border-radius: 7px; color: #ffffff; font-size: 15px; font-weight: bold; text-decoration: none;">
				View final result </a>
		</div>

		<div
			style="padding: 18px 32px; background-color: #f9fafb; color: #667085; font-size: 12px; line-height: 1.45;">
			You received this email because challenge-closed notifications are
			enabled in your notification configuration.</div>
	</div>
</body>
</html>
