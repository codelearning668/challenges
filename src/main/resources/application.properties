logging.pattern.console=[%d{ISO8601} %d{z}] %.-1level challenges [%t] %X{TransactionId} %c{1}.%M %m%n
spring.application.name=challenges
server.port=8790

spring.datasource.url=jdbc:postgresql://localhost:5432/challenges
spring.datasource.username=postgres
spring.datasource.password=sa
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

spring.data.jpa.database-platform: org.hibernate.dialect.PostgreSQLDialect
spring.data.jpa.database=postgresql
spring.data.jpa.sql.init.mode=never
spring.data.jpa.defer-datasource-initialization=false
spring.data.jpa.show-sql=true
spring.data.jpa.hibernate.ddl-auto:validate
