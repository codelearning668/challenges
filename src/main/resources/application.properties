logging.pattern.console=[%d{ISO8601} %d{z}] %.-1level challenges [%t] %X{TransactionId} %c{1}.%M %m%n

spring.application.name=challenges
server.port=8790
server.servlet.context-path=/challenges/svc

spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# do not execute schema/data SQL scripts (schema.sql, data.sql) on startup
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=validate

challenges.request-logging.exclude-paths=/users/register

springdoc.writer-with-default-pretty-printer=true
springdoc.api-docs.enabled=false
springdoc.api-docs.path=/api-docs

springdoc.swagger-ui.urls[0].name=
springdoc.swagger-ui.urls[0].url=/openapi/challenges_api.json
