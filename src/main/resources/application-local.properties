spring.datasource.url=jdbc:postgresql://localhost:5432/challenges
spring.datasource.username=postgres
spring.datasource.password=sa

# log SQL statements generated by Hibernate
spring.jpa.show-sql=true

challenges.exception.display-stack-trace:false
challenges.request-logging.enabled=true

# Enables runtime generation of OpenAPI documentation from the annotated API contracts.
# This lets the Maven api-docs profile regenerate the static specification used by the default application configuration.
# To verify the default static-document mode locally, comment out these three properties and restart the application. 
# The base application.properties values then apply, disabling runtime generation and making Swagger UI load /openapi/challenges_api.json.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.urls[0].name=Generated Challenges API
springdoc.swagger-ui.urls[0].url=/api-docs
